<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Journal - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo" width="30" height="30">
        <ul class="main-list"></ul>
    </header>

    <main class="main-login">
        {% block content %}
        <form action="{{ url_for('reg') }}" method="POST" class="login">
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

            <label for="email">
                <input class="form__input" type="email" name="email" id="email" placeholder="Enter your email" required>
            </label>

            <label for="password">
                <input class="form__input" type="password" name="password" id="password" placeholder="Enter your password" required>
            </label>

            <button class="form__button" type="submit">Create Account</button>
        </form>
        {% endblock %}
    </main>
</body>
</html>
